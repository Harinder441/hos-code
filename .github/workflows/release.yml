name: Release build

# Builds the release archives and keeps them as workflow artifacts; it publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build hos-code archives
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build archives
        run: ./build.sh

      - name: Check every archive carries the licences
        run: |
          for a in dist/*.tar.gz; do
            tar -tzf "$a" | grep -q '/LICENSE$' && tar -tzf "$a" | grep -q '/THIRD_PARTY_NOTICES.md$' || { echo "missing licence in $a"; exit 1; }
          done
          for a in dist/*.zip; do
            unzip -l "$a" | grep -q '/LICENSE$' && unzip -l "$a" | grep -q '/THIRD_PARTY_NOTICES.md$' || { echo "missing licence in $a"; exit 1; }
          done

      - name: Keep archives as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hos-code-${{ github.sha }}
          path: |
            dist/hos-code-*
            dist/checksums.txt
          retention-days: 14
